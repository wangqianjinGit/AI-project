  <text x="400" y="470" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">记得提前5-10分钟到达教室</text>
  <text x="400" y="495" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">带好相关教材和笔记本</text>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">关注天气变化，合理安排出行时间</text>
  
  <!-- 装饰元素 -->
