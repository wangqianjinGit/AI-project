    <style>
        /* 主页特有背景效果 */
        body {

            background-size: cover;
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态波浪效果 */
        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: gentleFloat 6s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }
        
        @keyframes gentleFloat {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.5;
            }
        }

        /* 确保容器在背景之上 */
        .container {
            position: relative;
            z-index: 10;
        }
    </style>

    <script>

                    // 获取按钮的data-action属性

                    // 如果是"上课"按钮，推送课程表
                    if (action === 'class') {
                        // 定义课程表内容
                        const schedule = `📚 本周课程表：

周一：
08:00-09:40 高等数学（教学楼A101）
10:00-11:40 大学英语（语音楼B202）
14:00-15:40 程序设计基础（计算机楼C303）

周二：
08:00-09:40 线性代数（教学楼A102）
10:00-11:40 物理实验（实验楼D401）
14:00-15:40 体育（操场）

周三：
08:00-09:40 数据库原理（计算机楼C304）
10:00-11:40 马克思主义原理（教学楼A201）

周四：
08:00-09:40 概率论与数理统计（教学楼A103）
10:00-11:40 数据结构（计算机楼C305）
14:00-15:40 大学物理（教学楼A202）

周五：

10:00-11:40 操作系统（计算机楼C307）

- 记得提前5-10分钟到达教室
- 带好相关教材和笔记本
- 关注天气变化，合理安排出行时间`;
                         
                        // 调用全局的addMessage函数添加消息

                            // 添加课程表图片

                        }

                        // 调用全局的addMessage函数添加消息

                            alert('美食推荐已生成，请查看控制台输出');
                        }
                    }
                });
            });
        });
    </script>

    <script>
        // 获取并显示用户的性格特质
        function displayUserPersonality() {
            const personalityDisplay = document.getElementById('personality-display');
            
            // 检测当前访问方式并选择合适的存储策略
            function getStorageStrategy() {
                // 始终使用localStorage存储，不再使用服务器存储
                return 'localStorage';
            }
            
            // 从localStorage获取性格特质
            function getPersonalityFromLocalStorage() {
                try {
                    return localStorage.getItem('userPersonality') || null;
                } catch (error) {
                    console.error('从localStorage获取性格特质失败:', error);
                    return null;
                }
            }
            
            // 获取完整的API基础URL
            function getApiBaseUrl() {
                const protocol = window.location.protocol;
                const host = window.location.hostname;
                const port = window.location.port || (protocol === 'https:' ? 443 : 8000);
                return `${protocol}//${host}:${port}`;
            }
            
            // 从服务器获取性格特质
            async function getPersonalityFromServer() {
                try {
                    const apiBaseUrl = getApiBaseUrl();
                    const response = await fetch(`${apiBaseUrl}/api/user/personality`, {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        throw new Error('服务器返回的不是有效的JSON数据');
                    }
                    
                    const data = await response.json();
                    if (response.ok) {
                        // 服务器返回的格式是 { personality: '...' }
                        return data.personality || null;
                    } else {
                        throw new Error(data.error || '获取性格特质失败');
                    }
                } catch (error) {
                    console.error('从服务器获取性格特质出错:', error);
                    return null;
                }
            }
            
            // 获取性格特质的显示文本
            function getPersonalityDisplayText(personality) {
                const personalityMap = {
                    'life': '全能校园NPC',
                    'learn': '学搭子Pro',
                    'growth': '成长合伙人',
                    'emotion': '树洞小耳朵'
                };
                return personalityMap[personality] || '未知';
            }
            
            // 主函数：获取并显示性格特质
            async function main() {
                const strategy = getStorageStrategy();
                let personality;
                
                if (strategy === 'localStorage') {
                    personality = getPersonalityFromLocalStorage();
                } else {
                    personality = await getPersonalityFromServer();
                }
                
                if (personality) {
                    personalityDisplay.textContent = getPersonalityDisplayText(personality);
                } else {
                    personalityDisplay.textContent = '未设置';
                }
            }
            
            // 执行主函数
            main();
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            displayUserPersonality();
        });
    </script>
