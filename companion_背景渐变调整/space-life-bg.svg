<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 深空背景 -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>
  
  <!-- 中心光晕 -->
  <ellipse cx="960" cy="540" rx="800" ry="600" fill="url(#glowCenter)"/>
  
  <!-- 星星层1 - 小星星 -->
  <g opacity="0.8">
    <circle cx="200" cy="130" r="1.5" fill="#ffffff"/>
    <circle cx="380" cy="70" r="1" fill="#ffffff"/>
    <circle cx="560" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="850" cy="110" r="1" fill="#ffffff"/>
    <circle cx="1080" cy="190" r="1.5" fill="#ffffff"/>
    <circle cx="1380" cy="80" r="1" fill="#ffffff"/>
    <circle cx="1580" cy="150" r="1.2" fill="#ffffff"/>
    <circle cx="1780" cy="130" r="1" fill="#ffffff"/>
    <circle cx="220" cy="330" r="1" fill="#ffffff"/>
    <circle cx="480" cy="270" r="1.2" fill="#ffffff"/>
    <circle cx="720" cy="360" r="1" fill="#ffffff"/>
    <circle cx="980" cy="300" r="1.5" fill="#ffffff"/>
    <circle cx="1220" cy="370" r="1" fill="#ffffff"/>
    <circle cx="1520" cy="310" r="1.2" fill="#ffffff"/>
    <circle cx="1760" cy="350" r="1" fill="#ffffff"/>
  </g>
  
  <!-- 星星层2 - 闪烁星星 -->
  <g opacity="0.9" filter="url(#glow)">
    <circle cx="420" cy="210" r="2" fill="#667eea"/>
    <circle cx="820" cy="470" r="2.5" fill="#764ba2"/>
    <circle cx="1220" cy="240" r="2" fill="#667eea"/>
    <circle cx="1520" cy="520" r="2.5" fill="#764ba2"/>
    <circle cx="620" cy="670" r="2" fill="#667eea"/>
  </g>
  
  <!-- 粒子流1 -->
  <g opacity="0.3">
    <path d="M 80,450 Q 380,400 680,450 T 1280,450" stroke="#667eea" stroke-width="1" fill="none"/>
    <circle cx="180" cy="430" r="3" fill="#667eea" opacity="0.6"/>
    <circle cx="480" cy="415" r="2" fill="#667eea" opacity="0.4"/>
    <circle cx="880" cy="440" r="2.5" fill="#667eea" opacity="0.5"/>
  </g>
  
  <!-- 粒子流2 -->
  <g opacity="0.25">
    <path d="M 1900,250 Q 1600,300 1300,250 T 700,250" stroke="#764ba2" stroke-width="1" fill="none"/>
    <circle cx="1700" cy="270" r="2.5" fill="#764ba2" opacity="0.5"/>
    <circle cx="1400" cy="285" r="2" fill="#764ba2" opacity="0.4"/>
    <circle cx="1000" cy="260" r="3" fill="#764ba2" opacity="0.6"/>
  </g>
  
  <!-- 科技网格线 -->
  <g opacity="0.15" stroke="#667eea" stroke-width="0.5" fill="none">
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <circle cx="960" cy="540" r="200"/>
    <circle cx="960" cy="540" r="400"/>
  </g>
  
  <!-- 大型光点装饰 -->
  <g opacity="0.6">
    <circle cx="320" cy="720" r="42" fill="#667eea" opacity="0.2"/>
    <circle cx="320" cy="720" r="21" fill="#667eea" opacity="0.4"/>
    <circle cx="1620" cy="820" r="48" fill="#764ba2" opacity="0.2"/>
    <circle cx="1620" cy="820" r="24" fill="#764ba2" opacity="0.4"/>
  </g>
  
  <!-- 生活页特有元素 - 心形和生活符号 -->
  <g transform="translate(960, 620)" opacity="0.8">
    <!-- 中心心形 -->
    <path d="M 0,-20 C -10,-30 -25,-30 -25,-15 C -25,-5 -15,10 0,25 C 15,10 25,-5 25,-15 C 25,-30 10,-30 0,-20 Z" fill="#ff6b9d" opacity="0.7"/>
    <path d="M 0,-20 C -10,-30 -25,-30 -25,-15 C -25,-5 -15,10 0,25 C 15,10 25,-5 25,-15 C 25,-30 10,-30 0,-20 Z" fill="none" stroke="#ff6b9d" stroke-width="2" opacity="0.9"/>
    
    <!-- 小心形装饰 -->
    <path d="M -80,-50 C -85,-55 -92,-55 -92,-48 C -92,-43 -87,-35 -80,-28 C -73,-35 -68,-43 -68,-48 C -68,-55 -75,-55 -80,-50 Z" fill="#ff6b9d" opacity="0.5"/>
    <path d="M 80,-60 C 75,-65 68,-65 68,-58 C 68,-53 73,-45 80,-38 C 87,-45 92,-53 92,-58 C 92,-65 85,-65 80,-60 Z" fill="#ff6b9d" opacity="0.5"/>
    
    <!-- 音乐符号 -->
    <circle cx="-70" cy="15" r="15" fill="#667eea" opacity="0.6"/>
    <text x="-70" y="23" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.9">♪</text>
    
    <circle cx="75" cy="10" r="15" fill="#764ba2" opacity="0.6"/>
    <text x="75" y="18" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.9">♫</text>
    
    <!-- 咖啡杯 -->
    <g transform="translate(-100, -80)">
      <rect x="-10" y="0" width="20" height="25" rx="3" fill="#667eea" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="12" ry="4" fill="#667eea" opacity="0.7"/>
      <path d="M 10,5 L 18,5 Q 22,10 18,15 L 10,15" stroke="#667eea" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M -8,3 Q -3,8 2,3" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.5"/>
      <path d="M -5,7 Q 0,12 5,7" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.5"/>
    </g>
    
    <!-- 相机 -->
    <g transform="translate(105, -75)">
      <rect x="-15" y="0" width="30" height="20" rx="3" fill="#764ba2" opacity="0.6"/>
      <rect x="-5" y="-5" width="10" height="5" rx="2" fill="#764ba2" opacity="0.7"/>
      <circle cx="0" cy="10" r="8" fill="#ffffff" opacity="0.4"/>
      <circle cx="0" cy="10" r="5" fill="#764ba2" opacity="0.8"/>
      <circle cx="10" cy="3" r="2" fill="#fbbf24" opacity="0.6"/>
    </g>
    
    <!-- 星星装饰（生活的小确幸） -->
    <path d="M -95,45 L -90,55 L -100,55 Z" fill="#fbbf24" opacity="0.6"/>
    <path d="M 100,40 L 105,50 L 95,50 Z" fill="#fbbf24" opacity="0.6"/>
  </g>
  
  <!-- 装饰性笑脸 -->
  <g opacity="0.3">
    <circle cx="300" cy="250" r="20" fill="none" stroke="#667eea" stroke-width="1.5"/>
    <circle cx="293" cy="245" r="2" fill="#667eea"/>
    <circle cx="307" cy="245" r="2" fill="#667eea"/>
    <path d="M 293,255 Q 300,260 307,255" stroke="#667eea" stroke-width="1.5" fill="none"/>
    
    <circle cx="1620" cy="350" r="20" fill="none" stroke="#764ba2" stroke-width="1.5"/>
    <circle cx="1613" cy="345" r="2" fill="#764ba2"/>
    <circle cx="1627" cy="345" r="2" fill="#764ba2"/>
    <path d="M 1613,355 Q 1620,360 1627,355" stroke="#764ba2" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- 远景星云 -->
  <ellipse cx="1420" cy="280" rx="155" ry="105" fill="#667eea" opacity="0.1"/>
  <ellipse cx="520" cy="830" rx="125" ry="85" fill="#764ba2" opacity="0.1"/>
</svg>