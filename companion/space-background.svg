  <!-- 行星 -->
  <!-- 左上角的黄色星球 -->
  <circle cx="100" cy="100" r="80" fill="url(#sunGradient)" filter="url(#blur)" />
  
  <!-- 右侧的绿色大行星 -->
  <circle cx="900" cy="300" r="150" fill="url(#planetGradient1)" />
  <path d="M900 150 A150 150 0 0 1 900 450" stroke="#16a34a" stroke-width="8" fill="none" />
  <path d="M900 170 A130 130 0 0 1 900 430" stroke="#166534" stroke-width="6" fill="none" />
  
  <!-- 右上角的浅蓝色小星球 -->
  <circle cx="950" cy="50" r="30" fill="#93c5fd" />
  
  <!-- 红色小星球 -->
  <circle cx="250" cy="300" r="20" fill="#ef4444" />
  
  <!-- 前景中的星球表面 -->
  <ellipse cx="500" cy="900" rx="800" ry="200" fill="#1e3a8a" />
  <ellipse cx="500" cy="900" rx="700" ry="170" fill="#1e40af" />
  
  <!-- 环形山 -->
  <circle cx="300" cy="800" r="40" fill="#3b82f6" opacity="0.3" />
  <circle cx="700" cy="780" r="60" fill="#3b82f6" opacity="0.3" />
