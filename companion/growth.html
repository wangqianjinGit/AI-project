<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的成长 - 小伴</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
        }

        .growth-container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
            font-size: 16px;
        }

        .radar-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .radar-section h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .chart-container {
            position: relative;
            height: 600px;
            max-width: 700px;
            margin: 0 auto;
        }

        .badges-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .badges-section h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .badge-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: white;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .badge-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .badge-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .badge-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .badge-description {
            font-size: 14px;
            opacity: 0.9;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 24px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-item {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="growth-container">
        <div class="page-header">
            <h1>🌟 我的成长</h1>
            <p>记录你的每一步进步，见证成长的力量</p>
        </div>

        <div class="stats-summary">
            <div class="stat-item">
                <div class="stat-value">55</div>
                <div class="stat-label">综合能力值</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">3</div>
                <div class="stat-label">获得徽章</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">5</div>
                <div class="stat-label">成长维度</div>
            </div>
        </div>

        <div class="radar-section">
            <h2>📊 能力雷达图</h2>
            <div class="chart-container">
                <canvas id="abilityRadar"></canvas>
            </div>
        </div>

        <div class="badges-section">
            <h2>🏆 成长徽章</h2>
            <div class="badges-grid">
                <div class="badge-card">
                    <div class="badge-icon">💰</div>
                    <div class="badge-name">理财达人</div>
                    <div class="badge-description">掌握基本理财知识，开启财富管理之路</div>
                </div>
                <div class="badge-card">
                    <div class="badge-icon">🎉</div>
                    <div class="badge-name">社牛</div>
                    <div class="badge-description">人际交往能力出众，朋友圈人气王</div>
                </div>
                <div class="badge-card">
                    <div class="badge-icon">💪</div>
                    <div class="badge-name">劳动标兵</div>
                    <div class="badge-description">积极参与实践活动，动手能力强</div>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-button">返回首页</a>
        </div>
    </div>

    <script>
        // 创建渐变色
        const ctx = document.getElementById('abilityRadar').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 600);
        gradient.addColorStop(0, 'rgba(102, 126, 234, 0.6)');
        gradient.addColorStop(0.5, 'rgba(118, 75, 162, 0.4)');
        gradient.addColorStop(1, 'rgba(245, 87, 108, 0.3)');
        
        // 创建雷达图
        const radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['专业课能力', '人际关系能力', '职业探索', '课外实践', '身心健康'],
                datasets: [{
                    label: '当前能力值',
                    data: [60, 70, 20, 40, 85],
                    fill: true,
                    backgroundColor: gradient,
                    borderColor: 'rgb(102, 126, 234)',
                    borderWidth: 3,
                    pointBackgroundColor: 'rgb(245, 87, 108)',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 3,
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: 'rgb(245, 87, 108)',
                    pointRadius: 8,
                    pointHoverRadius: 12
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                scales: {
                    r: {
                        angleLines: {
                            display: true,
                            color: 'rgba(102, 126, 234, 0.2)',
                            lineWidth: 2
                        },
                        suggestedMin: 0,
                        suggestedMax: 100,
                        ticks: {
                            stepSize: 20,
                            backdropColor: 'transparent',
                            color: '#667eea',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        grid: {
                            color: 'rgba(102, 126, 234, 0.15)',
                            lineWidth: 2
                        },
                        pointLabels: {
                            font: {
                                size: 16,
                                weight: 'bold'
                            },
                            color: '#667eea'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            font: {
                                size: 16,
                                weight: 'bold'
                            },
                            color: '#667eea',
                            padding: 20
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(102, 126, 234, 0.9)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        padding: 12,
                        cornerRadius: 8,
                        titleFont: {
                            size: 14,
                            weight: 'bold'
                        },
                        bodyFont: {
                            size: 16
                        },
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.parsed.r + '分';
                            }
                        }
                    }
                }
            }
        })
    </script>
</body>
</html>
