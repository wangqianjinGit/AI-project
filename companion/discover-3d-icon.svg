<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="compassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="needleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF5350;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E53935;stop-opacity:1" />
    </linearGradient>
    <filter id="discoverShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 指南针外圈 -->
  <circle cx="24" cy="24" r="18" fill="url(#compassGradient)" filter="url(#discoverShadow)"/>
  
  <!-- 内圈 -->
  <circle cx="24" cy="24" r="15" fill="#E3F2FD"/>
  
  <!-- 刻度线 -->
  <line x1="24" y1="10" x2="24" y2="14" stroke="#1E88E5" stroke-width="2"/>
  <line x1="24" y1="34" x2="24" y2="38" stroke="#1E88E5" stroke-width="2"/>
  <line x1="10" y1="24" x2="14" y2="24" stroke="#1E88E5" stroke-width="2"/>
  <line x1="34" y1="24" x2="38" y2="24" stroke="#1E88E5" stroke-width="2"/>
  
  <!-- 斜向刻度 -->
  <line x1="14.6" y1="14.6" x2="17.2" y2="17.2" stroke="#1E88E5" stroke-width="1.5"/>
  <line x1="33.4" y1="14.6" x2="30.8" y2="17.2" stroke="#1E88E5" stroke-width="1.5"/>
  <line x1="14.6" y1="33.4" x2="17.2" y2="30.8" stroke="#1E88E5" stroke-width="1.5"/>
  <line x1="33.4" y1="33.4" x2="30.8" y2="30.8" stroke="#1E88E5" stroke-width="1.5"/>
  
  <!-- 方向字母 -->
  <text x="24" y="13" text-anchor="middle" font-size="5" fill="#1E88E5" font-weight="bold">N</text>
  <text x="24" y="37" text-anchor="middle" font-size="5" fill="#1E88E5" font-weight="bold">S</text>
  <text x="13" y="26" text-anchor="middle" font-size="5" fill="#1E88E5" font-weight="bold">W</text>
  <text x="35" y="26" text-anchor="middle" font-size="5" fill="#1E88E5" font-weight="bold">E</text>
  
  <!-- 指针 -->
  <polygon points="24,16 26,24 24,28 22,24" fill="url(#needleGradient)"/>
  <polygon points="24,28 26,24 24,32 22,24" fill="#424242"/>
  
  <!-- 中心点 -->
  <circle cx="24" cy="24" r="3" fill="#FFFFFF"/>
  <circle cx="24" cy="24" r="2" fill="#EF5350"/>
</svg>