<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 阴影 -->
  <ellipse cx="100" cy="185" rx="60" ry="12" fill="rgba(0,0,0,0.2)" filter="blur(5px)"/>
  
  <!-- 主体 -->
  <g>
    <!-- 身体 -->
    <ellipse cx="100" cy="160" rx="50" ry="45" fill="#a8e6cf" stroke="#98d8bd" stroke-width="2"/>
    
    <!-- 手臂 -->
    <ellipse cx="170" cy="135" rx="15" ry="30" fill="#a8e6cf" stroke="#98d8bd" stroke-width="2" transform="rotate(-20, 170, 135)"/>
    <ellipse cx="30" cy="135" rx="15" ry="30" fill="#a8e6cf" stroke="#98d8bd" stroke-width="2" transform="rotate(20, 30, 135)"/>
    
    <!-- 头部 -->
    <circle cx="100" cy="75" r="65" fill="#a8e6cf" stroke="#98d8bd" stroke-width="2"/>
    
    <!-- 天线 -->
    <path d="M80,30 L80,10" stroke="#a8e6cf" stroke-width="8" stroke-linecap="round" stroke="#98d8bd" stroke-width="2"/>
    <path d="M120,30 L120,10" stroke="#a8e6cf" stroke-width="8" stroke-linecap="round" stroke="#98d8bd" stroke-width="2"/>
    <circle cx="80" cy="10" r="10" fill="#ffb6c1" stroke="#ff8fa3" stroke-width="1"/>
    <circle cx="120" cy="10" r="10" fill="#ffb6c1" stroke="#ff8fa3" stroke-width="1"/>
    
    <!-- 眼睛 -->
    <circle cx="70" cy="65" r="20" fill="#000"/>
    <circle cx="130" cy="65" r="20" fill="#000"/>
    <circle cx="65" cy="60" r="10" fill="#fff"/>
    <circle cx="125" cy="60" r="10" fill="#fff"/>
    <circle cx="60" cy="55" r="5" fill="#000"/>
    <circle cx="120" cy="55" r="5" fill="#000"/>
    
    <!-- 嘴巴 -->
    <path d="M75,95 Q100,110 125,95" stroke="#000" stroke-width="4" fill="none"/>
    
    <!-- 肚子细节 -->
    <path d="M80,145 Q100,135 120,145" stroke="#000" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M80,155 Q100,145 120,155" stroke="#000" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M80,165 Q100,155 120,165" stroke="#000" stroke-width="1.5" fill="none" opacity="0.6"/>
    
    <!-- 腿部 -->
    <ellipse cx="80" cy="200" rx="12" ry="15" fill="#a8e6cf" stroke="#98d8bd" stroke-width="2"/>
    <ellipse cx="120" cy="200" rx="12" ry="15" fill="#a8e6cf" stroke="#98d8bd" stroke-width="2"/>
  </g>
</svg>