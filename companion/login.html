<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小伴 - 首页</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 登录页面视频背景容器 */
        body {
            position: relative;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .logo-img {
      /* width: 100px; */
       width: 150px; /* 原来是100px，放大1.5倍 */
      height: auto;
      display: block;
      /* margin: -0px auto 0 auto;  上移 10px，水平居中 */
       margin: 0 auto;
    }

        /* 视频背景样式 */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* 视频遮罩层（可选，增强文字可读性） */
        .video-background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        /* 登录页面特有样式 - 垂直居中布局 */
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 0;
            background: none;
            border: none;
            box-shadow: none;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* gap: 30px;*/
            /* gap: 10px; */
            gap:4px;
        }

        /* 应用名称样式 */
        .login-title {
            font-size: 3rem;
            color: #ffffff;
            margin: 0;
            margin-top: -80px;
            font-weight: 300;
            font-family: 'FZFW_QINGQIAO', '方正FW轻俏颂体', 'Microsoft YaHei UI Light', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 8px;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        /* 提示文案样式 */
        .login-subtitle {
            font-size: 1rem;
            color: #ffffff;
            margin: 0;
            font-weight: 500;
            font-family: 'Microsoft YaHei UI Light', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* 输入框样式 */
        .nickname-input {
            width: 100%;
            max-width: 350px;
            padding: 14px 20px;
            font-size: 16px;
            /* background: transparent; */
            background: rgba(255, 255, 255, 0.15);  /* 半透明白色背景 */
            backdrop-filter: blur(4px);              /* 可选：增加模糊，提升可读性 */
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            color: #ffffff;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .nickname-input::placeholder {
            color: rgba(200, 200, 200, 0.8);
            font-weight: 300;
        }

        .nickname-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: transparent;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        /* 确定按钮样式 */
        .login-btn {
            width: 100%;
            max-width: 350px;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 2px;
            border: none;
            border-radius: 12px;
            /* background: linear-gradient(135deg, #5ec8e5 0%, #4a9fd8 100%); */
            background: linear-gradient(135deg, #3a78b8 0%, #1f4f8b 100%);
           /* background-color: #1f4f8b; */
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(94, 200, 229, 0.3);
           /* box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); */
            font-family: 'Microsoft YaHei UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #6dd4f0 0%, #5baae3 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(94, 200, 229, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            display: none;
        }

        /* 错误消息样式 */
        .error-message {
            color: rgba(255, 107, 107, 0.9);
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-shadow: 0 0 8px rgba(255, 107, 107, 0.5);
        }

        /* 加载指示器 */
        .loading-indicator {
            display: none;
            margin: 10px auto;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #64DFDF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .login-container {
                width: 90%;
                padding: 30px 20px;
            }
            
            .login-title {
                font-size: 2rem;
            }
        }
    </style>

        })();
    </script>
</head>
<body>
    <!-- 视频背景 -->
    <div class="video-background">
        <video id="bg-video" autoplay muted loop playsinline preload="auto">
            <source src="login.mp4" type="video/mp4">
            您的浏览器不支持视频播放
        </video>
    </div>

    <div class="container">
        <div class="login-container">
            <!-- <h1 class="login-title">小伴</h1> -->
<h1 class="logo-text">
  <img src="xiaoban.png" alt="小伴" class="logo-img"/>
</h1>
            <p class="slogan-text" style="font-size: 20px; color: rgba(255, 255, 255, 0.85); margin: 5px 0 25px 0; line-height: 1.6; text-align: center; font-weight: 600; white-space: nowrap;">陪你的小日常,懂你的小情绪,我是小伴,填满你学生时代的每个瞬间</p>
            <!-- <h1 class="logo-text">
  <img src="xiaoban.png" alt="小伴" />
</h1> -->
            <p class="login-subtitle">请输入你的昵称</p>
            
            <input type="text" id="nickname-input" class="nickname-input" placeholder="昵称" autocomplete="off">
            <div class="loading-indicator" id="loading-indicator"></div>
            <div class="error-message" id="error-message"></div>
            <button id="login-btn" class="login-btn" disabled>确定</button>
            
            <div class="login-footer">
                <p>您的昵称将被保存在服务器本地，方便下次使用</p>
            </div>
        </div>
    </div>

    <script>
        // DOM元素初始化
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorMessage = document.getElementById('error-message');

        // 检查输入框内容，启用/禁用登录按钮
        nicknameInput.addEventListener('input', function() {
            loginBtn.disabled = this.value.trim() === '';
            errorMessage.style.display = 'none'; // 清除错误消息
        });

        // 检测当前访问方式并选择合适的存储策略
        function getStorageStrategy() {
            // 始终使用localStorage存储，不再使用服务器存储
            return 'localStorage';
        }

        // 保存昵称（智能选择存储方式）
        async function saveNickname(nickname) {
            const strategy = getStorageStrategy();
            
            if (strategy === 'localStorage') {
                // 使用localStorage存储
                try {
                    localStorage.setItem('userNickname', nickname);
                    return true;
                } catch (error) {
                    console.error('保存昵称到localStorage失败:', error);
                    showError('保存昵称失败，请检查浏览器设置');
                    return false;
                }
            } else {
                // 使用服务器存储
                return await saveNicknameToServer(nickname);
            }
        }

        // 获取昵称（智能选择存储方式）
        async function getNickname() {
            const strategy = getStorageStrategy();
            
            if (strategy === 'localStorage') {
                // 从localStorage获取
                try {
                    return localStorage.getItem('userNickname') || '';
                } catch (error) {
                    console.error('从localStorage获取昵称失败:', error);
                    return '';
                }
            } else {
                // 从服务器获取
                return await getNicknameFromServer();
            }
        }

        // 获取完整的API基础URL
        function getApiBaseUrl() {
            const protocol = window.location.protocol;
            const host = window.location.hostname;
            const port = window.location.port || (protocol === 'https:' ? 443 : 8000);
            return `${protocol}//${host}:${port}`;
        }

        // 保存昵称到服务器
        async function saveNicknameToServer(nickname) {
            try {
                const apiBaseUrl = getApiBaseUrl();
                const response = await fetch(`${apiBaseUrl}/api/user/nickname`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nickname: nickname }),
                    credentials: 'include' // 包含Cookie等凭证
                });
                
                // 检查响应是否为空
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('服务器返回的不是有效的JSON数据');
                }
                
                const data = await response.json();
                if (response.ok && data.success) {
                    return true;
                } else {
                    throw new Error(data.error || '保存昵称失败');
                }
            } catch (error) {
                console.error('保存昵称到服务器出错:', error);
                // 提供更具体的错误信息
                let errorMsg = error.message;
                if (errorMsg === 'Failed to fetch') {
                    errorMsg = '无法连接到服务器，请确认服务器已启动并正在运行';
                }
                showError(errorMsg);
                return false;
            }
        }

        // 从服务器获取昵称
        async function getNicknameFromServer() {
            try {
                const apiBaseUrl = getApiBaseUrl();
                const response = await fetch(`${apiBaseUrl}/api/user/nickname`, {
                    credentials: 'include'
                });
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    return '';
                }
                
                const data = await response.json();
                return data.nickname || '';
            } catch (error) {
                console.error('从服务器获取昵称出错:', error);
                // 静默失败，不显示错误消息
                return '';
            }
        }

        // 显示错误消息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // 登录按钮点击事件
        loginBtn.addEventListener('click', async function() {
            const nickname = nicknameInput.value.trim();
            if (nickname) {
                // 显示加载状态
                loadingIndicator.style.display = 'block';
                loginBtn.disabled = true;
                
                // 保存昵称（智能选择存储方式）
                const success = await saveNickname(nickname);
                
                // 隐藏加载状态
                loadingIndicator.style.display = 'none';
                
                if (success) {
                    // 页面跳转到性格特质选择页面
                window.location.href = 'personality.html';
                } else {
                    loginBtn.disabled = false;
                }
            }
        });

        // 监听回车键
        nicknameInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && !loginBtn.disabled) {
                loginBtn.click();
            }
        });

        // 页面加载时检查是否已有保存的昵称
        window.addEventListener('load', async function() {
            // 智能选择存储方式获取昵称
            const savedNickname = await getNickname();
            if (savedNickname) {
                nicknameInput.value = savedNickname;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
