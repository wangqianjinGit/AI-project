<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小伴 - 首页</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 登录页面特有样式 - 适配电脑端和app端 */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .login-title {
            font-size: 3.5rem;
            color: white;
            margin-bottom: 40px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        .nickname-input {
            width: 280px;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #8BC6EC;
            border-radius: 12px;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            color: white;
            text-align: center;
        }

        .nickname-input:focus {
            border-color: #64DFDF;
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 12px rgba(139, 198, 236, 0.4);
        }

        .login-btn {
            width: 180px;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            background-color: #8BC6EC;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(139, 198, 236, 0.4);
        }

        .login-btn:hover {
            background-color: #64DFDF;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(100, 223, 223, 0.5);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 错误消息样式 */
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* 加载指示器 */
        .loading-indicator {
            display: none;
            margin: 10px auto;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #64DFDF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .login-title {
                font-size: 3rem;
            }
        }
    </style>
    <script>
        // 百度统计
        var _hmt = _hmt || [];
        (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?3fe867119ef61c6aa6c8c4722d0555cb";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="app-frame">
            <div class="login-container">
                <!-- 标题已在背景图中包含，这里隐藏 -->
                <h1 class="login-title" style="display: none;">小伴</h1>
                <p style="color: white; margin-bottom: 30px; font-size: 16px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);">请输入你的昵称</p>
                
                <input type="text" id="nickname-input" class="nickname-input" placeholder="" autocomplete="off">
                <div class="loading-indicator" id="loading-indicator"></div>
                <div class="error-message" id="error-message"></div>
                <button id="login-btn" class="login-btn" disabled>确定</button>
            </div>
        </div>
    </div>

    <script>
        // DOM元素初始化
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorMessage = document.getElementById('error-message');

        // 检查输入框内容，启用/禁用登录按钮
        nicknameInput.addEventListener('input', function() {
            loginBtn.disabled = this.value.trim() === '';
            errorMessage.style.display = 'none'; // 清除错误消息
        });

        // 保存昵称（使用localStorage存储）
        async function saveNickname(nickname) {
            try {
                localStorage.setItem('userNickname', nickname);
                return true;
            } catch (error) {
                console.error('保存昵称到localStorage失败:', error);
                showError('保存昵称失败，请检查浏览器设置');
                return false;
            }
        }

        // 获取昵称（从localStorage获取）
        async function getNickname() {
            try {
                return localStorage.getItem('userNickname') || '';
            } catch (error) {
                console.error('从localStorage获取昵称失败:', error);
                return '';
            }
        }

        // 显示错误消息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // 登录按钮点击事件
        loginBtn.addEventListener('click', async function() {
            const nickname = nicknameInput.value.trim();
            if (nickname) {
                // 显示加载状态
                loadingIndicator.style.display = 'block';
                loginBtn.disabled = true;
                
                // 保存昵称（智能选择存储方式）
                const success = await saveNickname(nickname);
                
                // 隐藏加载状态
                loadingIndicator.style.display = 'none';
                
                if (success) {
                    // 页面跳转到性格特质选择页面
                window.location.href = 'personality.html';
                } else {
                    loginBtn.disabled = false;
                }
            }
        });

        // 监听回车键
        nicknameInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && !loginBtn.disabled) {
                loginBtn.click();
            }
        });

        // 页面加载时检查是否已有保存的昵称
        window.addEventListener('load', async function() {
            // 智能选择存储方式获取昵称
            const savedNickname = await getNickname();
            if (savedNickname) {
                nicknameInput.value = savedNickname;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
