<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 深空蓝与赛博紫渐变基底 -->
    <radialGradient id="bgGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#2a3f5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </radialGradient>
    
    <!-- 赛博紫渐变层 -->
    <radialGradient id="purpleLayer" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#6b46c1;stop-opacity:0.15" />
      <stop offset="60%" style="stop-color:#4c1d95;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    
    <!-- 光粒子发光效果 -->
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 数据流线模糊效果 -->
    <filter id="streamGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 脉动动画 -->
    <animate id="pulse1" attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    <animate id="pulse2" attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
    <animate id="pulse3" attributeName="opacity" values="0.35;0.65;0.35" dur="3.5s" repeatCount="indefinite"/>
  </defs>
  
  <!-- 深空蓝基底 -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- 赛博紫渐变层 -->
  <rect width="1920" height="1080" fill="url(#purpleLayer)"/>
  
  <!-- 透明数据流线 - 优雅曲线 -->
  <g opacity="0.25" stroke="#60a5fa" stroke-width="0.8" fill="none" filter="url(#streamGlow)">
    <path d="M -100,300 Q 400,250 800,350 T 1600,400 T 2000,350">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M -100,500 Q 500,450 900,550 T 1700,600 T 2000,550">
      <animate attributeName="stroke-opacity" values="0.4;0.7;0.4" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M -100,700 Q 450,650 850,750 T 1650,800 T 2000,750">
      <animate attributeName="stroke-opacity" values="0.35;0.65;0.35" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 200,-100 Q 250,300 300,700 T 400,1200">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 1600,-100 Q 1550,300 1500,700 T 1400,1200">
      <animate attributeName="stroke-opacity" values="0.35;0.65;0.35" dur="6.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 微小光粒子层1 - 静态粒子 -->
  <g opacity="0.4" fill="#e0e7ff" filter="url(#particleGlow)">
    <circle cx="150" cy="120" r="0.8"/>
    <circle cx="320" cy="200" r="1"/>
    <circle cx="580" cy="150" r="0.7"/>
    <circle cx="820" cy="180" r="0.9"/>
    <circle cx="1100" cy="220" r="0.8"/>
    <circle cx="1350" cy="140" r="1"/>
    <circle cx="1600" cy="190" r="0.7"/>
    <circle cx="1800" cy="160" r="0.9"/>
    <circle cx="200" cy="400" r="0.8"/>
    <circle cx="450" cy="350" r="1"/>
    <circle cx="700" cy="420" r="0.7"/>
    <circle cx="950" cy="380" r="0.9"/>
    <circle cx="1200" cy="450" r="0.8"/>
    <circle cx="1500" cy="390" r="1"/>
    <circle cx="1750" cy="440" r="0.7"/>
    <circle cx="250" cy="600" r="0.9"/>
    <circle cx="500" cy="650" r="0.8"/>
    <circle cx="750" cy="620" r="1"/>
    <circle cx="1000" cy="680" r="0.7"/>
    <circle cx="1250" cy="640" r="0.9"/>
    <circle cx="1550" cy="690" r="0.8"/>
    <circle cx="1800" cy="660" r="1"/>
    <circle cx="300" cy="850" r="0.7"/>
    <circle cx="550" cy="900" r="0.9"/>
    <circle cx="850" cy="870" r="0.8"/>
    <circle cx="1100" cy="920" r="1"/>
    <circle cx="1400" cy="890" r="0.7"/>
    <circle cx="1650" cy="940" r="0.9"/>
  </g>
  
  <!-- 微小光粒子层2 - 脉动粒子 -->
  <g fill="#a5b4fc" filter="url(#particleGlow)">
    <circle cx="400" cy="250" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="300" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1300" cy="280" r="1.1" opacity="0.5">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="500" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="550" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1600" cy="520" r="1.1" opacity="0.5">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="750" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="800" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="780" r="1.1" opacity="0.5">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1500" cy="820" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 微小光粒子层3 - 更多脉动粒子 -->
  <g fill="#c7d2fe" filter="url(#particleGlow)">
    <circle cx="500" cy="180" r="0.9" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="220" r="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1450" cy="240" r="0.9" opacity="0.4">
      <animate attributeName="opacity" values="0.28;0.68;0.28" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="450" r="0.9" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="480" r="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1350" cy="460" r="0.9" opacity="0.4">
      <animate attributeName="opacity" values="0.28;0.68;0.28" dur="4.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="720" r="0.9" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="5.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="760" r="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1300" cy="740" r="0.9" opacity="0.4">
      <animate attributeName="opacity" values="0.28;0.68;0.28" dur="5.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>