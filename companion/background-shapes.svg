  <defs>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
  </defs>
  <circle cx="20" cy="20" r="15" fill="rgba(255, 255, 255, 0.2)" filter="url(#blur)" />
  <circle cx="80" cy="30" r="20" fill="rgba(255, 255, 255, 0.15)" filter="url(#blur)" />
  <circle cx="50" cy="80" r="25" fill="rgba(255, 255, 255, 0.1)" filter="url(#blur)" />
</svg>