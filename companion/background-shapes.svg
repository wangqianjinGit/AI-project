<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 800">
  <!-- 背景星空 -->
  <rect width="100%" height="100%" fill="#0A1128"/>
  
  <!-- 密集星空 -->
  <g>
    <!-- 上方密集星星 -->
    <circle cx="50" cy="30" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="120" cy="50" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="180" cy="20" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="230" cy="70" r="0.5" fill="white" opacity="0.6"/>
    <circle cx="290" cy="40" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="340" cy="60" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="390" cy="30" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="450" cy="80" r="0.5" fill="white" opacity="0.6"/>
    <circle cx="510" cy="40" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="560" cy="70" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="610" cy="30" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="670" cy="90" r="0.5" fill="white" opacity="0.6"/>
    <circle cx="730" cy="50" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="780" cy="80" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="830" cy="40" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="890" cy="60" r="0.5" fill="white" opacity="0.6"/>
    <circle cx="950" cy="20" r="0.8" fill="white" opacity="0.9"/>
    
    <!-- 中间密集星星 -->
    <circle cx="30" cy="150" r="0.6" fill="white" opacity="0.8"/>
    <circle cx="90" cy="120" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="150" cy="170" r="0.5" fill="white" opacity="0.7"/>
    <circle cx="210" cy="140" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="260" cy="190" r="0.6" fill="white" opacity="0.6"/>
    <circle cx="320" cy="150" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="380" cy="180" r="0.5" fill="white" opacity="0.7"/>
    <circle cx="430" cy="140" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="490" cy="170" r="0.6" fill="white" opacity="0.6"/>
    <circle cx="550" cy="130" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="610" cy="160" r="0.5" fill="white" opacity="0.7"/>
    <circle cx="660" cy="120" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="720" cy="150" r="0.6" fill="white" opacity="0.6"/>
    <circle cx="780" cy="190" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="830" cy="140" r="0.5" fill="white" opacity="0.7"/>
    <circle cx="890" cy="170" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="940" cy="130" r="0.6" fill="white" opacity="0.6"/>
    <circle cx="980" cy="160" r="0.8" fill="white" opacity="0.9"/>
    
    <!-- 下方密集星星 -->
    <circle cx="70" cy="250" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="130" cy="220" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="190" cy="270" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="240" cy="240" r="0.5" fill="white" opacity="0.6"/>
    <circle cx="300" cy="280" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="360" cy="230" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="410" cy="260" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="470" cy="220" r="0.5" fill="white" opacity="0.6"/>
    <circle cx="530" cy="270" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="580" cy="240" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="640" cy="280" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="700" cy="230" r="0.5" fill="white" opacity="0.6"/>
    <circle cx="750" cy="260" r="0.8" fill="white" opacity="0.9"/>
    <circle cx="810" cy="220" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="870" cy="250" r="0.7" fill="white" opacity="0.8"/>
    <circle cx="920" cy="280" r="0.5" fill="white" opacity="0.6"/>
    <circle cx="970" cy="240" r="0.8" fill="white" opacity="0.9"/>
  </g>
  
  <!-- 渐变紫色天空 -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="60%" stop-color="#4B0082" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4B0082" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>
  
  <!-- 左上角大橙色星球 -->
  <g>
    <ellipse cx="-80" cy="-80" rx="120" ry="120" fill="#FFA500"/>
    <ellipse cx="-90" cy="-90" rx="90" ry="90" fill="#FFD700" opacity="0.4"/>
  </g>
  
  <!-- 右上角蓝色小行星 -->
  <circle cx="970" cy="180" r="20" fill="#6495ED"/>
  
  <!-- 中间红色小行星 -->
  <circle cx="320" cy="250" r="12" fill="#FF6347"/>
  
  <!-- 右侧绿色大星球 -->
  <g>
    <ellipse cx="950" cy="400" rx="200" ry="200" fill="#20B2AA"/>
    <ellipse cx="970" cy="380" rx="160" ry="160" fill="#7FFFD4" opacity="0.3"/>
  </g>
  
  <!-- 底部蓝色行星表面 -->
  <g>
    <ellipse cx="500" cy="750" rx="600" ry="250" fill="#4169E1"/>
    <ellipse cx="520" cy="770" rx="500" ry="220" fill="#87CEFA" opacity="0.2"/>
    
    <!-- 行星表面的环形山 -->
    <circle cx="200" cy="650" r="35" stroke="#5A7BCC" stroke-width="2" fill="none"/>
    <circle cx="450" cy="680" r="25" stroke="#5A7BCC" stroke-width="2" fill="none"/>
    <circle cx="650" cy="660" r="40" stroke="#5A7BCC" stroke-width="2" fill="none"/>
    <circle cx="850" cy="690" r="30" stroke="#5A7BCC" stroke-width="2" fill="none"/>
  </g>
</svg>